name: Prepare WebMCP integration
on:
  push:
    branches: [work/prepare-webmcp-integration]
permissions:
  contents: write
concurrency:
  group: prepare-webmcp-integration
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'ayme-labs/playwright-lite' && github.ref == 'refs/heads/work/prepare-webmcp-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Bundle the compiled runtime for test injection
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/upstream/adapter-bridge.ts')
          s = p.read_text()
          assert s.count('readFileSync') == 2
          s = s.replace('import { readFileSync } from "node:fs";', 'import { buildSync } from "esbuild";')
          start = s.index('  const dist = readFileSync(ADAPTER_DIST_PATH, "utf8");')
          end = s.index('  return cachedBundle;', start)
          s = s[:start] + '''  // Bundle the built package, including shared chunks, without source aliases.
            cachedBundle = buildSync({
              entryPoints: [ADAPTER_DIST_PATH],
              bundle: true,
              write: false,
              platform: "browser",
              format: "iife",
              globalName: "window.__pwLiteAdapter",
            }).outputFiles[0]!.text;

          ''' + s[end:]
          p.write_text(s)
          PY
          pnpm exec prettier --write tests/upstream/adapter-bridge.ts
          git add tests/upstream/adapter-bridge.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: inject the complete compiled runtime bundle'
          git push origin HEAD:work/prepare-webmcp-integration
          git log -1 --format='PREPARED_COMMIT %H%nPREPARED_TREE %T'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm generate:check
      - name: Verify fork
        run: |
          set +e
          pnpm check > "$RUNNER_TEMP/check.log" 2>&1
          status=$?
          tail -n 100 "$RUNNER_TEMP/check.log"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fork-test-results
          path: |
            test-results
            ${{ runner.temp }}/check.log
          if-no-files-found: ignore
