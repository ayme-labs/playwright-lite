name: Prepare WebMCP integration
on:
  push:
    branches: [work/prepare-webmcp-integration]
permissions:
  contents: write
concurrency:
  group: prepare-webmcp-integration
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'ayme-labs/playwright-lite' && github.ref == 'refs/heads/work/prepare-webmcp-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Keep the test bundle global explicit
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/upstream/adapter-bridge.ts')
          s = p.read_text()
          old = '    globalName: "window.__pwLiteAdapter",'
          assert old in s
          s = s.replace(old, '    globalName: "__pwLiteBundle",\n    footer: { js: "globalThis.__pwLiteAdapter = __pwLiteBundle;" },')
          p.write_text(s)
          PY
          pnpm exec prettier --write tests/upstream/adapter-bridge.ts
          git add tests/upstream/adapter-bridge.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: initialize the browser bridge in the global realm'
          git push origin HEAD:work/prepare-webmcp-integration
          git log -1 --format='PREPARED_COMMIT %H%nPREPARED_TREE %T'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify guard behavior
        run: pnpm test:guards
      - name: Verify fork
        run: |
          set +e
          pnpm check > "$RUNNER_TEMP/check.log" 2>&1
          status=$?
          tail -n 100 "$RUNNER_TEMP/check.log"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fork-test-results
          path: |
            test-results
            ${{ runner.temp }}/check.log
          if-no-files-found: ignore
